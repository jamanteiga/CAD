<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebCAD Libre</title>
<meta name="description" content="CAD 2D libre en el navegador al estilo AutoCAD: dibujo, edición, bloques dinámicos, AutoLISP, DXF/DWG y menús R12.">
<link rel="stylesheet" href="css/cad.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <button id="appbtn" title="Menú de aplicación"><b>A</b><span>CAD</span></button>
    <div class="qat" id="qat"></div>
    <select id="wsSel" title="Espacio de trabajo">
      <option value="ribbon">Drafting &amp; Annotation</option>
      <option value="classic">AutoCAD Classic (R12)</option>
      <option value="both">Cinta + menús R12</option>
    </select>
    <div id="title"></div>
    <input id="searchBox" type="text" placeholder="Type a keyword or phrase" aria-label="Buscar comando">
  </header>
  <nav id="menubar" hidden></nav>
  <section id="ribbon"><div id="rtabs"></div><div id="rpanels"></div></section>
  <div id="filetabs"></div>
  <main id="work">
    <div id="host">
      <div id="vptag"></div>
      <div id="cmd">
        <div id="cmdhist"></div>
        <div id="cmdrow">
          <button class="tbtn" id="cmdX" title="Cancelar (Esc)"></button>
          <button class="tbtn" id="cmdCfg" title="Personalizar"></button>
          <span id="cmdprompt"></span>
          <input id="cmdin" type="text" autocomplete="off" spellcheck="false" placeholder="Type a command" aria-label="Línea de comandos">
        </div>
        <div id="ac" hidden></div>
      </div>
      <div id="dyn" hidden></div>
    </div>
    <aside id="screen" hidden aria-label="Menú de pantalla R12"></aside>
  </main>
  <footer id="bottom">
    <div id="ltabs"></div>
    <div id="coords"></div>
    <div id="status"></div>
  </footer>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
